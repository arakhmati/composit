name: CPU platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COMPOSIT_BUILD_PYIMMER: '0'
      SONIC_USE_OPENCL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up MinGW on Windows
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ graphviz
      - name: Install Graphviz on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graphviz --no-progress -y
          "C:\Program Files\Graphviz\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest==7.3.0 scipy==1.15.0 networkx==3.4.2
      - name: Test core and native library loading
        run: >-
          python -m pytest tests/composit tests/networkx_compatibility_tests
          tests/mosaic/test_aligned_array.py tests/mosaic/backends/x86/test_compile.py
